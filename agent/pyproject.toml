[project]
name = "my-agent"
version = "0.1.0"
description = "一个最小但工程化的 ReAct 智能体"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S307"]  # calculator 里的 eval 已做白名单校验

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # 测试里用 assert 是正常的
"notebooks/*" = ["S101", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
